<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <title id="title">CivicReport request flow</title>
  <desc id="desc">The browser holds no API key. It calls same-origin endpoints on the Node server, which holds the key in its environment and is the only party that talks to the Gemini API.</desc>

  <rect width="1000" height="560" fill="#0C0B09"/>

  <text x="40" y="48" fill="#F3F0E8" font-size="19" font-weight="600" letter-spacing="1.5">CIVICREPORT / REQUEST FLOW</text>
  <text x="40" y="72" fill="#A6A192" font-size="12.5">The browser never sees the key. One hop, one holder, one place to rotate it.</text>
  <line x1="40" y1="90" x2="960" y2="90" stroke="#F3F0E8" stroke-opacity="0.12"/>

  <!-- Browser -->
  <rect x="40" y="130" width="270" height="300" rx="12" fill="#171613" stroke="#F3F0E8" stroke-opacity="0.16"/>
  <text x="62" y="164" fill="#FF5A1F" font-size="12" letter-spacing="2">01 / BROWSER</text>
  <text x="62" y="192" fill="#F3F0E8" font-size="15" font-weight="600">app.js</text>
  <text x="62" y="214" fill="#A6A192" font-size="11.5">No key. Nothing secret ships here.</text>

  <rect x="62" y="234" width="226" height="60" rx="8" fill="#1D1B17" stroke="#F3F0E8" stroke-opacity="0.12"/>
  <text x="76" y="258" fill="#CFC9BA" font-size="12">localStorage</text>
  <text x="76" y="278" fill="#A6A192" font-size="11">reports, re-validated on read</text>

  <rect x="62" y="306" width="226" height="60" rx="8" fill="#1D1B17" stroke="#F3F0E8" stroke-opacity="0.12"/>
  <text x="76" y="330" fill="#CFC9BA" font-size="12">Leaflet, Chart.js</text>
  <text x="76" y="350" fill="#A6A192" font-size="11">pinned, optionally vendored with SRI</text>

  <text x="62" y="396" fill="#A6A192" font-size="11">Photos downscaled and re-encoded, so</text>
  <text x="62" y="414" fill="#A6A192" font-size="11">EXIF and GPS never leave the device.</text>

  <!-- Browser to server -->
  <line x1="310" y1="280" x2="420" y2="280" stroke="#FF5A1F" stroke-width="1.6"/>
  <path d="M420 280l-9 -5v10z" fill="#FF5A1F"/>
  <text x="316" y="266" fill="#FF5A1F" font-size="11">same origin</text>
  <text x="316" y="302" fill="#A6A192" font-size="10.5">/api/analyze</text>
  <text x="316" y="318" fill="#A6A192" font-size="10.5">/api/insights</text>

  <!-- Server -->
  <rect x="420" y="130" width="290" height="300" rx="12" fill="#171613" stroke="#F3F0E8" stroke-opacity="0.16"/>
  <text x="442" y="164" fill="#FF5A1F" font-size="12" letter-spacing="2">02 / NODE SERVER</text>
  <text x="442" y="192" fill="#F3F0E8" font-size="15" font-weight="600">server.js, zero dependencies</text>

  <rect x="442" y="210" width="246" height="46" rx="8" fill="#1D1B17" stroke="#F3F0E8" stroke-opacity="0.12"/>
  <text x="456" y="231" fill="#CFC9BA" font-size="11.5">static files, path allow-list</text>
  <text x="456" y="247" fill="#A6A192" font-size="10.5">traversal and dotfiles refused</text>

  <rect x="442" y="266" width="246" height="46" rx="8" fill="#1D1B17" stroke="#F3F0E8" stroke-opacity="0.12"/>
  <text x="456" y="287" fill="#CFC9BA" font-size="11.5">origin gate, rate limit</text>
  <text x="456" y="303" fill="#A6A192" font-size="10.5">12 per 10 min, 4 concurrent</text>

  <rect x="442" y="322" width="246" height="46" rx="8" fill="#1D1B17" stroke="#F3F0E8" stroke-opacity="0.12"/>
  <text x="456" y="343" fill="#CFC9BA" font-size="11.5">prompt built here, reply validated</text>
  <text x="456" y="359" fill="#A6A192" font-size="10.5">fixed schema, clamped lengths</text>

  <rect x="442" y="378" width="246" height="36" rx="8" fill="#241812" stroke="#FF5A1F" stroke-opacity="0.5"/>
  <text x="456" y="401" fill="#FF5A1F" font-size="11.5">GEMINI_API_KEY, environment only</text>

  <!-- Server to Gemini -->
  <line x1="710" y1="280" x2="820" y2="280" stroke="#FF5A1F" stroke-width="1.6"/>
  <path d="M820 280l-9 -5v10z" fill="#FF5A1F"/>
  <text x="716" y="266" fill="#FF5A1F" font-size="11">x-goog-api-key</text>
  <text x="716" y="302" fill="#A6A192" font-size="10.5">never in the URL</text>

  <!-- Gemini -->
  <rect x="820" y="200" width="140" height="160" rx="12" fill="#171613" stroke="#F3F0E8" stroke-opacity="0.16"/>
  <text x="842" y="234" fill="#FF5A1F" font-size="12" letter-spacing="2">03 / GEMINI</text>
  <text x="842" y="262" fill="#F3F0E8" font-size="13">Generative</text>
  <text x="842" y="280" fill="#F3F0E8" font-size="13">Language API</text>
  <text x="842" y="306" fill="#A6A192" font-size="10.5">gemini-2.5-flash</text>
  <text x="842" y="324" fill="#A6A192" font-size="10.5">falls back once if</text>
  <text x="842" y="340" fill="#A6A192" font-size="10.5">the model retires</text>

  <!-- Blocked direct call -->
  <path d="M270 470 L830 470" stroke="#FF6B6B" stroke-opacity="0.6" stroke-width="1.4" stroke-dasharray="6 5"/>
  <line x1="545" y1="458" x2="561" y2="482" stroke="#FF6B6B" stroke-width="2"/>
  <line x1="561" y1="458" x2="545" y2="482" stroke="#FF6B6B" stroke-width="2"/>
  <text x="575" y="475" fill="#FF6B6B" font-size="11.5">direct browser to Gemini calls, removed</text>
  <text x="40" y="475" fill="#A6A192" font-size="11">Browser to server</text>

  <line x1="40" y1="508" x2="960" y2="508" stroke="#F3F0E8" stroke-opacity="0.12"/>
  <text x="40" y="534" fill="#A6A192" font-size="11.5">Revoke and rotate the key in Google AI Studio if it was ever committed, then run: npm run scan:history</text>
</svg>
